<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smile Video Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { color: #0088cc; font-size: 20px; }
        .video-title {
            font-size: 16px;
            font-weight: bold;
            color: #444;
            margin-bottom: 15px;
            background: #eef6ff;
            padding: 10px;
            border-radius: 5px;
        }
        .ad-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #ff9900;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }
        .ad-btn.watched {
            background-color: #4CAF50;
        }
        .watch-btn {
            display: none;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }
        p { font-size: 14px; color: #666; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎥 Smile Video Player</h2>
        <div id="videoTitleBox" class="video-title">ဗီဒီယိုကို ဖွင့်ရန် ကြော်ငြာကြည့်ပါ</div>
        <p>ဗီဒီယိုကြည့်ရှုရန် အောက်ပါကြော်ငြာလင့်ခ် ၂ ခုကို အရင်နှိပ်ပြီး ကြည့်ရှုပေးပါ။</p>

        <!-- Ad Link 1 -->
        <a href="https://www.profitableratecpmnetwork.com/ket1i5d7eg?key=4fd15bb6bdffdc535b455feca70aab53" target="_blank" class="ad-btn" id="ad1" onclick="markWatched(1)">ကြော်ငြာလင့်ခ် (၁) ကြည့်ရန်</a>
        
        <!-- Ad Link 2 -->
        <a href="https://www.profitableratecpmnetwork.com/ket1i5d7eg?key=4fd15bb6bdffdc535b455feca70aab53" target="_blank" class="ad-btn" id="ad2" onclick="markWatched(2)">ကြော်ငြာလင့်ခ် (၂) ကြည့်ရန်</a>

        <!-- Video Watch Button (Hidden initially) -->
        <a href="#" id="watchBtn" target="_blank" class="watch-btn">ဗီဒီယိုကြည့်ရန် နှိပ်ပါ</a>
    </div>

    <script>
        // URL ထဲက ဗီဒီယိုအချက်အလက်များကို ဖတ်ယူခြင်း
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('url');
        const videoTitle = urlParams.get('title');

        if (videoTitle) {
            document.getElementById('videoTitleBox').innerText = decodeURIComponent(videoTitle);
        }

        let ad1Watched = false;
        let ad2Watched = false;

        function markWatched(adNumber) {
            if (adNumber === 1) {
                ad1Watched = true;
                let btn1 = document.getElementById('ad1');
                btn1.innerText = '✅ ကြော်ငြာ (၁) ကြည့်ပြီးပါပြီ';
                btn1.classList.add('watched');
            } else if (adNumber === 2) {
                ad2Watched = true;
                let btn2 = document.getElementById('ad2');
                btn2.innerText = '✅ ကြော်ငြာ (၂) ကြည့်ပြီးပါပြီ';
                btn2.classList.add('watched');
            }

            // ကြော်ငြာ ၂ ခုလုံးကြည့်ပြီးမှ ဗီဒီယိုလင့်ခ်ကို ပွင့်စေရန်
            if (ad1Watched && ad2Watched) {
                let watchBtn = document.getElementById('watchBtn');
                if (videoUrl) {
                    watchBtn.href = decodeURIComponent(videoUrl);
                } else {
                    watchBtn.href = "https://t.me/Smilevideo36"; // Default channel link
                }
                watchBtn.style.display = 'block';
            }
        }
    </script>

</body>
</html>
